# Minimal CAIOS R1 regression. No inherited Playwright matrices, macOS, large runners,
# artifacts, releases, publishing, schedules, or external services.
# Standard GitHub-hosted Ubuntu is free in public repositories.
name: CAIOS browser and installation acceptance regression

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/caios-r1.yml"
      - "scripts/caios_approved_browser_task.py"
      - "scripts/package_caios_windows.py"
      - "scripts/windows-smoke/**"
      - "tests/caios/**"
      - "packages/extension/src/ownedTab.ts"
      - "packages/extension/src/tabPicker.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/caios-r1.yml"
      - "scripts/caios_approved_browser_task.py"
      - "tests/caios/**"
      - "packages/extension/src/ownedTab.ts"
      - "packages/extension/src/tabPicker.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caios-r1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-regression:
    name: Browser runner and standard install acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical Python sources and test syntax
        run: python3 -m py_compile scripts/caios_approved_browser_task.py scripts/package_caios_windows.py tests/caios/test_approved_browser_task.py tests/caios/test_install_acceptance_suite.py tests/caios/test_windows_package.py
      - name: Run browser runner, real-world acceptance plan and ZIP tests
        run: python3 -m unittest discover -s tests/caios -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify only consented blank-tab conversion and internal-page protections
        run: node --no-warnings --test tests/caios/blank-tab-picker.test.mjs tests/caios/tab-picker-blank.test.mjs
