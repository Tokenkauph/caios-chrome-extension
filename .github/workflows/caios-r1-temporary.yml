name: CAIOS R1 focused runner tests (temporary)
on:
  push:
    branches:
      - fix/r1-restoration-verify-20261117
    paths:
      - .github/workflows/caios-r1-temporary.yml
      - scripts/caios_approved_browser_task.py
      - tests/caios/test_approved_browser_task.py
jobs:
  python-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify source syntax
        run: python3 -m py_compile scripts/caios_approved_browser_task.py tests/caios/test_approved_browser_task.py
      - name: Run focused fake-MCP regression
        run: python3 -m unittest discover -s tests/caios -p test_approved_browser_task.py -v
